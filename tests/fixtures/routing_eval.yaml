  - history: [{role: user, content: "Can you analyze my portfolio?"}, {role: assistant, agent: portfolio, content: "Your portfolio is well diversified."}]
    question: "Why is diversification important?"
    expected: finance_qa
  - history: [{role: user, content: "What's in the financial news today?"}, {role: assistant, agent: news, content: "Stocks fell on inflation worries."}]
    question: "How is Apple stock doing?"
    expected: market
  - history: [{role: user, content: "What is a Roth IRA?"}, {role: assistant, agent: finance_qa, content: "A Roth IRA is a retirement account."}]
    question: "What are the tax rules for withdrawals?"
    expected: tax
  - history: [{role: user, content: "What's in the financial news today?"}, {role: assistant, agent: news, content: "Stocks fell on inflation worries."}]
    question: "What is inflation?"
    expected: finance_qa
  - history: [{role: user, content: "How is my portfolio?"}, {role: assistant, agent: portfolio, content: "It is 60% stocks and 40% bonds."}]
    question: "What is the S&P 500 doing today?"
    expected: market
  - history: [{role: user, content: "What is an HSA?"}, {role: assistant, agent: tax, content: "An HSA is a tax-advantaged account for medical costs."}]
