[project]
name = "finnie"
version = "0.1.0"
description = "Finnie: AI Finance Assistant, a multi-agent conversational tutor for beginner investors"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
markers = ["live: calls real external APIs; runs only with RUN_LIVE_TESTS=1"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# The line that starts a module when it is run with `python -m ...`. The commands' behavior is tested
# through their main() functions and, for the config check, in a real subprocess.
exclude_also = ["if __name__ == .__main__.:"]
